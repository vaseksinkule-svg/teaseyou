<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jsi offline — Tease you</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        body { display: grid; place-items: center; min-height: 100vh; padding: 40px var(--gutter); }
        .standalone { max-width: 460px; display: grid; justify-items: start; gap: 14px; }
        .standalone .logo { font-size: 28px; margin-bottom: 20px; }
        .standalone h1 { font-family: var(--head); font-weight: 600; letter-spacing: -.03em; line-height: 1.06; font-size: clamp(36px, 9vw, 56px); }
        .standalone p { color: var(--ink-2); font-size: 17px; line-height: 1.5; }
        .standalone .note { color: var(--muted); font-size: 14px; }
        .standalone .btn { margin-top: 10px; }
    </style>
</head>
<body>
    <main class="standalone">
        <span class="logo">Tease you</span>
        <h1>Jsi offline</h1>
        <p>Vypadlo ti připojení. Čaj počká.</p>
        <p class="note">Košík zůstává uložený v prohlížeči, až se připojíš, najdeš ho tam.</p>
        <button class="btn btn-primary btn-lg" onclick="location.reload()">Zkusit znovu</button>
    </main>
    <script>
        addEventListener('online', () => location.reload());
    </script>
</body>
</html>
