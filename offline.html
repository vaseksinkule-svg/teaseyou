<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jsi offline — Tease you</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233a5f3c'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f5f1e9' font-family='Georgia,serif'%3ET%3C/text%3E%3C/svg%3E">
    <style>
        body { display: grid; place-items: center; min-height: 100vh; padding: 40px var(--gutter); }
        .standalone { max-width: 460px; display: grid; justify-items: start; gap: 14px; }
        .standalone .logo { font-size: 28px; margin-bottom: 20px; }
        .standalone h1 { font-family: var(--sans); font-weight: 800; font-stretch: var(--wide); letter-spacing: -.02em; line-height: 1; font-size: clamp(36px, 9vw, 56px); }
        .standalone p { color: var(--ink-2); font-size: 17px; line-height: 1.5; }
        .standalone .note { color: var(--muted); font-size: 14px; }
        .standalone .btn { margin-top: 10px; }
    </style>
</head>
<body>
    <main class="standalone">
        <span class="logo">Tease you</span>
        <h1>Jsi offline</h1>
        <p>Vypadlo ti připojení. Čaj počká.</p>
        <p class="note">Košík zůstává uložený v prohlížeči, až se připojíš, najdeš ho tam.</p>
        <button class="btn btn-primary btn-lg" onclick="location.reload()">Zkusit znovu</button>
    </main>
    <script>
        addEventListener('online', () => location.reload());
    </script>
</body>
</html>
